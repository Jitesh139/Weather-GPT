services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_DB: weathergpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # One-shot: builds the Vite/React frontend into ./frontend/dist, which
  # the backend below then serves at "/". Runs to completion before the
  # backend starts. Uses its own anonymous volume for node_modules so the
  # Linux install never clobbers a host (Windows/macOS) node_modules.
  frontend-build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/dist:/frontend:ro

volumes:
  pgdata:
  frontend_node_modules:
